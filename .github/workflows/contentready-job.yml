name: ContentReady Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job folder ID under contentready-jobs
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: contentready-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ inputs.job_id }}
      WHISPER_MODEL: small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: contentready-actions/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1

      - name: Install Python dependencies
        run: pip install -r contentready-actions/requirements.txt

      - name: Process job
        run: python contentready-actions/process_job.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: contentready-${{ inputs.job_id }}
          path: contentready-output/${{ inputs.job_id }}/
          if-no-files-found: error
          retention-days: 7
