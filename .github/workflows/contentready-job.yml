name: ContentReady Job
run-name: ContentReady ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job folder ID under contentready-jobs
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: contentready-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ inputs.job_id }}
      WHISPER_MODEL: small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hydrate job from media library
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          job_id = "${{ inputs.job_id }}"
          job_dir = root / "contentready-jobs" / job_id
          config = json.loads((job_dir / "job.json").read_text(encoding="utf-8"))

          audio_path = root / config["audio_path"]
          if not audio_path.is_file():
              raise FileNotFoundError(audio_path)
          shutil.copy2(audio_path, job_dir / f"audio{audio_path.suffix.lower()}")

          for index, value in enumerate(config.get("video_paths", [])):
              source = root / value
              if not source.is_file():
                  raise FileNotFoundError(source)
              shutil.copy2(source, job_dir / f"clip-{index:03d}-{source.name}")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: contentready-actions/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1

      - name: Install Python dependencies
        run: pip install -r contentready-actions/requirements.txt

      - name: Process job
        run: python contentready-actions/process_job.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: contentready-${{ inputs.job_id }}
          path: contentready-output/${{ inputs.job_id }}/
          if-no-files-found: error
          retention-days: 7
